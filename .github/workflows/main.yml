name: Visual Regression

on:
  pull_request:

jobs:
  visual-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install PixellPeep CLI
        run: |
          npm install -g pixellpeep

      - name: Verify PixellPeep installation
        run: |
          pixellpeep --version

      - name: Run Django server
        run: |
          python manage.py runserver &
          sleep 10

      - name: Generate screenshots
        run: |
          echo "Generate screenshots here"

      - name: PixellPeep Compare
        run: |
          pixellpeep compare \
            --base ./baseline \
            --current ./current \
            --post-github-check true
        env:
          PIXELLPEEP_API_KEY: ${{ secrets.PIXELLPEEP_API_KEY }}
